<!doctype html>
<!--
  Forking this for your own card?

    1. Page title + meta + OG       below in <head>
    2. Brand colours                :root variables in <style>
    3. Photo                        replace files in /images/, then update
                                    the <meta og:image> above and the <img>
                                    in EDIT > PROFILE
    4. Name / role / tagline        EDIT > PROFILE
    5. Links                        EDIT > LINKS  (wrap two in <div class="row">
                                    to put them side-by-side)
    6. vCard                        edit and rename /thomas.vcf, then update
                                    the href in EDIT > SAVE CONTACT
    7. Footer + logo                EDIT > FOOTER
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0c14" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">

<!-- EDIT > META -->
<title>Thomas Brenas — Kursol</title>
<meta name="description" content="Head of Operations & Growth at Kursol. Book a call, connect on LinkedIn, or save my contact.">
<meta property="og:type" content="profile">
<meta property="og:title" content="Thomas Brenas — Kursol">
<meta property="og:description" content="Head of Operations & Growth at Kursol.">
<meta property="og:image" content="/images/thomas-400.webp">
<link rel="icon" type="image/webp" href="/favicon.webp">

<style>
/* EDIT > COLOURS — light mode */
:root {
  --bg: #f5f5f7;
  --glass: rgba(255,255,255,0.6);
  --glass-border: rgba(0,0,0,0.08);
  --text: #1a1a2e;
  --muted: rgba(0,0,0,0.6);
  --faint: rgba(0,0,0,0.4);
  --border: rgba(0,0,0,0.08);
  --tile: rgba(0,0,0,0.03);
  --primary: #3232ff;
  --accent: #49ff49;
  --shadow: 0 20px 40px rgba(0,0,0,0.12), 0 8px 16px rgba(0,0,0,0.06);
}
/* EDIT > COLOURS — dark mode */
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c0c14;
    --glass: rgba(255,255,255,0.05);
    --glass-border: rgba(255,255,255,0.08);
    --text: #f0f0f5;
    --muted: rgba(255,255,255,0.6);
    --faint: rgba(255,255,255,0.38);
    --border: rgba(255,255,255,0.08);
    --tile: rgba(255,255,255,0.04);
    --shadow: 0 20px 40px rgba(0,0,0,0.4), 0 8px 16px rgba(0,0,0,0.25);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 400 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed; inset: 0; z-index: -1;
  background:
    radial-gradient(ellipse at 30% 70%, rgba(50,50,255,0.15), transparent 60%),
    radial-gradient(ellipse at 70% 30%, rgba(73,255,73,0.06), transparent 50%);
}
main {
  width: 100%;
  max-width: 420px;
  padding: clamp(1rem, 3vh, 2rem) 1.5rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(0.75rem, 2vh, 1.5rem);
}
.card {
  width: 100%;
  background: var(--glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  padding: clamp(1.25rem, 4vh, 2.5rem);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(0.75rem, 2vh, 1.5rem);
}
.photo {
  width: clamp(80px, 15vh, 120px);
  height: clamp(80px, 15vh, 120px);
  border-radius: 50%;
  padding: 3px;
  background: linear-gradient(135deg, var(--accent), var(--primary));
  flex-shrink: 0;
}
.photo img {
  width: 100%; height: 100%;
  border-radius: 50%;
  object-fit: cover;
  display: block;
}
h1 {
  font-size: clamp(1.25rem, 3.5vh, 1.75rem);
  font-weight: 700;
  text-align: center;
  letter-spacing: -0.02em;
}
.role { color: var(--muted); text-align: center; margin-top: -0.75rem; font-size: 0.95rem; }
.tag { color: var(--faint); text-align: center; margin-top: -1rem; font-size: 0.85rem; }
.links {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  margin-top: 0.5rem;
}
.row { display: flex; gap: 0.6rem; }
.row a { flex: 1; }
.row a span { padding-right: 0; }
a.link {
  display: flex;
  align-items: center;
  padding: 0.65rem 1rem;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--tile);
  color: var(--text);
  text-decoration: none;
  font-size: 0.95rem;
  transition: border-color 150ms, box-shadow 150ms, transform 250ms cubic-bezier(0.16,1,0.3,1);
}
a.link:hover {
  transform: translateY(-2px);
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(50,50,255,0.2);
}
a.link:active { transform: translateY(0); }
a.link svg {
  width: 20px; height: 20px;
  margin-right: 14px;
  flex-shrink: 0;
  color: var(--faint);
}
a.link span { flex: 1; text-align: center; padding-right: 34px; }
a.save {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 0.75rem 1rem;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), var(--primary));
  color: #fff;
  font-weight: 700;
  text-decoration: none;
  transition: transform 250ms, box-shadow 150ms;
}
a.save:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(50,50,255,0.35);
}
a.save svg { width: 20px; height: 20px; }
footer {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
  margin-top: 0.5rem;
}
footer span { font-size: 0.7rem; color: var(--faint); }
footer a { opacity: 0.3; transition: opacity 150ms; }
footer a:hover { opacity: 0.7; }
footer img { height: 24px; width: auto; }
</style>
</head>
<body>

<main>
  <div class="card">
    <!-- EDIT > PROFILE -->
    <div class="photo">
      <img src="/images/thomas-400.webp"
           srcset="/images/thomas.webp 200w, /images/thomas-400.webp 400w"
           sizes="120px"
           alt="Thomas Brenas">
    </div>

    <h1>Thomas Brenas</h1>
    <p class="role">Head of Operations &amp; Growth</p>
    <p class="tag">Your AI Implementation Team</p>

    <!-- EDIT > LINKS -->
    <nav class="links">
      <a class="link" href="https://calendar.app.google/ngt5xMfhjLrZiK4R8" target="_blank" rel="noopener">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="14" height="14" rx="2"/><path d="M3 8h14M7 2v3M13 2v3"/></svg>
        <span>Let&rsquo;s get a coffee</span>
      </a>

      <div class="row">
        <a class="link" href="tel:+61450291784">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M5.2 2.6l1.5-.4a1 1 0 011.1.5l1 2a1 1 0 01-.2 1.1L7.3 7.1a9 9 0 005.6 5.6l1.3-1.3a1 1 0 011.1-.2l2 1a1 1 0 01.5 1.1l-.4 1.5a1 1 0 01-1 .7A14 14 0 012.5 3.6a1 1 0 01.7-1z"/></svg>
          <span>Call</span>
        </a>
        <a class="link" href="sms:+61450291784">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3 4h14a1 1 0 011 1v8a1 1 0 01-1 1H6l-3 3V5a1 1 0 011-1z"/></svg>
          <span>Text</span>
        </a>
      </div>

      <a class="link" href="mailto:thomas@kursol.com.au">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="16" height="12" rx="2"/><path d="M2 4l8 6 8-6"/></svg>
        <span>Email</span>
      </a>

      <a class="link" href="https://www.linkedin.com/in/thomasbrenas/" target="_blank" rel="noopener">
        <svg viewBox="0 0 20 20" fill="currentColor"><path d="M4.94 3.5a1.44 1.44 0 110 2.88 1.44 1.44 0 010-2.88zM3.7 7.5h2.48v8.5H3.7zm4.46 0h2.38v1.16h.03c.33-.63 1.14-1.3 2.35-1.3 2.52 0 2.98 1.66 2.98 3.81V16h-2.48v-3.78c0-.9-.02-2.06-1.26-2.06-1.26 0-1.45.98-1.45 2v3.84H8.16z"/></svg>
        <span>LinkedIn</span>
      </a>

      <div class="row">
        <a class="link" href="https://kursol.com.au" target="_blank" rel="noopener">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="8"/><ellipse cx="10" cy="10" rx="3.5" ry="8"/><path d="M2 10h16"/></svg>
          <span>Visit Kursol</span>
        </a>
        <a class="link" href="https://www.linkedin.com/company/kursol-io" target="_blank" rel="noopener">
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="M4.94 3.5a1.44 1.44 0 110 2.88 1.44 1.44 0 010-2.88zM3.7 7.5h2.48v8.5H3.7zm4.46 0h2.38v1.16h.03c.33-.63 1.14-1.3 2.35-1.3 2.52 0 2.98 1.66 2.98 3.81V16h-2.48v-3.78c0-.9-.02-2.06-1.26-2.06-1.26 0-1.45.98-1.45 2v3.84H8.16z"/></svg>
          <span>Kursol</span>
        </a>
      </div>
    </nav>

    <!-- EDIT > SAVE CONTACT — href must match the .vcf filename -->
    <a class="save" href="/thomas.vcf">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M10 3v10m0 0l-3.5-3.5M10 13l3.5-3.5M3 15v1a1 1 0 001 1h12a1 1 0 001-1v-1"/></svg>
      Save Contact
    </a>
  </div>

  <!-- EDIT > FOOTER -->
  <footer>
    <span>Kursol Pty Ltd · Sydney · Los Angeles · Austin</span>
    <a href="https://kursol.com.au" target="_blank" rel="noopener" aria-label="Kursol">
      <img src="/images/kursol-logo.webp" alt="Kursol" height="24" width="24">
    </a>
  </footer>
</main>

</body>
</html>
